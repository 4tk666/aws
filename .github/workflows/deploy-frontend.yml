name: Deploy frontend to S3

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate settings
        shell: bash
        run: |
          : "${AWS_REGION:?Set the AWS_REGION repository variable}"
          : "${AWS_ROLE_ARN:?Set the AWS_ROLE_ARN repository variable}"
          : "${S3_BUCKET:?Set the S3_BUCKET repository variable}"
          : "${VITE_API_URL:?Set the VITE_API_URL repository variable}"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend to S3
        shell: bash
        run: |
          test -s frontend/dist/index.html
          # Upload assets first; keep old assets for pages already open in browsers.
          aws s3 sync frontend/dist/ "s3://${S3_BUCKET}/" \
            --exclude 'index.html' --no-progress
          aws s3 cp frontend/dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control 'no-cache' --content-type 'text/html' --no-progress

      - name: Invalidate CloudFront cache (optional)
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'
