<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ページが見つかりません | Task App</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #313546;
        background: #f3f3f8;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 24px 16px;
        place-items: center;
        background:
          radial-gradient(circle at 15% 10%, rgba(133, 116, 242, 0.16), transparent 30%),
          radial-gradient(circle at 85% 85%, rgba(110, 188, 202, 0.13), transparent 26%),
          #f3f3f8;
      }

      main {
        width: min(100%, 560px);
        padding: clamp(32px, 7vw, 64px) 24px;
        border: 1px solid rgba(213, 218, 229, 0.8);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 80px rgba(31, 39, 61, 0.11);
        text-align: center;
      }

      .brand {
        margin: 0 0 24px;
        color: #676d80;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }

      .error-code {
        margin: 0 0 16px;
        color: #685bdd;
        font-size: clamp(80px, 20vw, 112px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      h1 {
        margin: 0 0 16px;
        color: #25293a;
        font-size: clamp(20px, 4vw, 26px);
        line-height: 1.5;
      }

      .description {
        margin: 0 0 32px;
        color: #676d80;
        font-size: 14px;
        line-height: 1.9;
      }

      .home-link {
        display: inline-block;
        padding: 14px 24px;
        border-radius: 10px;
        color: #fff;
        background: #685bdd;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      .home-link:hover { background: #584bc7; }
      .home-link:focus-visible {
        outline: 3px solid #685bdd;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">TASK APP</p>
      <p class="error-code">404</p>
      <h1>ページが見つかりません</h1>
      <p class="description">
        お探しのページは移動または削除されたか、<br />
        URLが間違っている可能性があります。
      </p>
      <a class="home-link" href="/">トップページへ戻る</a>
    </main>
  </body>
</html>
